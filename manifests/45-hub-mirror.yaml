# Docker Hub pull-through cache ("mirror") for the runners' dind + buildkitd.
#
# WHY
#   Every runner pod's dind store starts empty by design (per-pod hostPath subdirs,
#   GC'd by 30-store-gc.yaml), so every E2E job re-pulls the same public images from
#   Docker Hub — registry:2, kindest/node (~1-2 GB), and everything the workload's
#   kind cluster pulls through dockerd. All of it egresses via one shared IP, and
#   Docker Hub's anonymous per-IP pull quota is easy to exhaust under a parallel
#   cohort matrix. Observed live 2026-08-14 on sugarmaple-app CI: a TLS timeout on
#   apache/kafka-native, a failed manifest HEAD on node:22-slim, and a hard
#   `429 Too Many Requests` on registry:2 that killed a cohort's cluster bootstrap.
#
#   This registry runs in proxy (pull-through cache) mode: the first pull of each
#   image goes to Hub, every later pull from any runner pod is served off the LUN.
#   One piece of work fixes both the rate limiting and the redundant multi-GB
#   kindest/node pulls.
#
# HOW IT IS CONSUMED
#   - dind:      `--registry-mirror=http://arc-hub-mirror.arc-runners.svc.cluster.local:5000`
#                (20-scale-set.yaml). dockerd tries the mirror first and falls back
#                to Docker Hub on any mirror failure, so an unhealthy mirror degrades
#                to today's behavior instead of breaking pulls.
#   - buildkitd: `--config=/etc/buildkit/buildkitd.toml` pointing at the ConfigMap
#                below (20-scale-set.yaml). BuildKit likewise falls back to the
#                upstream registry if the mirror errors.
#   Both daemons resolve the service through normal pod DNS — they run in the runner
#   pod's network namespace.
#
#   A mirror only applies to docker.io images. ghcr.io / public.ecr.aws / quay pulls
#   are untouched (and don't rate-limit anonymous pulls the way Hub does).
#
# WHAT IT DOES NOT DO
#   - No authentication to Docker Hub: the proxy pulls anonymously, so the *mirror
#     host* is still subject to Hub's anonymous quota for cache MISSES. That is the
#     point — misses happen once per image per TTL instead of once per job. If quota
#     is ever hit again, add REGISTRY_PROXY_USERNAME / REGISTRY_PROXY_PASSWORD from
#     a secret for the authenticated (higher) quota.
#   - It is NOT the workflows' localhost:5001 kind-registry — that one runs inside
#     each job's dind for `--push`ing locally-built images and stays as is.
#
# STORAGE
#   Cached blobs -> iSCSI LUN via hostPath, same fail-loud pattern as every other
#   store: the hub-mirror dir is created INSIDE the mount (install.sh), and
#   hostPath type: Directory makes pods fail immediately if the LUN is not mounted
#   instead of silently filling the local disk. The registry's own scheduler expires
#   proxied content (default TTL 7 days; REGISTRY_STORAGE_DELETE_ENABLED below is
#   required for that expiry to actually delete blobs).
#
# The image is pulled from AWS's public mirror of the Docker official registry image
# rather than Hub itself — the mirror should not depend on the quota it exists to
# avoid.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: arc-hub-mirror
  namespace: arc-runners
  labels:
    app: arc-hub-mirror
spec:
  replicas: 1
  selector:
    matchLabels:
      app: arc-hub-mirror
  template:
    metadata:
      labels:
        app: arc-hub-mirror
    spec:
      automountServiceAccountToken: false
      containers:
        - name: registry
          image: public.ecr.aws/docker/library/registry:2
          env:
            - name: REGISTRY_PROXY_REMOTEURL
              value: https://registry-1.docker.io
            # Without this the scheduler marks proxied content expired but never
            # reclaims the bytes — the LUN would grow without bound.
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /v2/
              port: 5000
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /v2/
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
      volumes:
        - name: data
          hostPath:
            path: /mnt/arc-block/hub-mirror
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: arc-hub-mirror
  namespace: arc-runners
  labels:
    app: arc-hub-mirror
spec:
  type: ClusterIP
  selector:
    app: arc-hub-mirror
  ports:
    - port: 5000
      targetPort: 5000
---
# buildkitd has no --registry-mirror flag; mirrors are file config only. Mounted by
# the buildkitd sidecar in 20-scale-set.yaml via --config. The second stanza marks
# the mirror endpoint itself as plain HTTP (it is in-cluster; TLS would be
# certificate churn for zero benefit on a ClusterIP hop).
apiVersion: v1
kind: ConfigMap
metadata:
  name: arc-buildkitd-config
  namespace: arc-runners
data:
  buildkitd.toml: |
    [registry."docker.io"]
      mirrors = ["arc-hub-mirror.arc-runners.svc.cluster.local:5000"]

    [registry."arc-hub-mirror.arc-runners.svc.cluster.local:5000"]
      http = true
