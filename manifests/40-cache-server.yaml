# Self-hosted GitHub Actions cache server.
#
# WHY
#   actions/cache normally round-trips to GitHub's hosted cache over the internet.
#   With 12 concurrent runners on a ~100-job matrix that's a thundering herd —
#   many jobs each uploading an identical cache (~21s to pack+upload, observed
#   2026-08-13 on sugarmaple-app). This keeps cache traffic on the LAN and the
#   data on the iSCSI LUN.
#
# HOW IT AUTHENTICATES
#   No shared secret. The server verifies each runner's ACTIONS_RUNTIME_TOKEN JWT
#   against GitHub's OIDC JWKS (token.actions.githubusercontent.com), so a runner
#   can only touch its own repo's cache scope. Do NOT set SKIP_TOKEN_VALIDATION —
#   upstream is explicit that it disables signature verification entirely and is a
#   dev-only escape hatch.
#
# API VERSION
#   This serves the twirp github.actions.results.api.v1.CacheService routes, i.e.
#   GitHub's cache API **v2**, which requires actions/cache@v4.2 or newer.
#   Older actions/cache versions use the v1 API and will keep talking to GitHub.
#
# STORAGE
#   filesystem driver + sqlite, both on the iSCSI LUN via hostPath. The chart's
#   own PVC is disabled because local-path would put it on the slow local disk.
#   sqlite needs real file locking, so it must be on the LUN (ext4), never NFS.
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: arc-cache-server
  namespace: kube-system
spec:
  chart: oci://ghcr.io/falcondev-oss/charts/github-actions-cache-server
  version: "1.1.3"
  targetNamespace: arc-runners
  createNamespace: false
  valuesContent: |-
    # Predictable service name: arc-cache.arc-runners.svc.cluster.local:3000
    fullnameOverride: arc-cache

    replicaCount: 1

    config:
      apiBaseUrl: http://arc-cache.arc-runners.svc.cluster.local:3000
      # Runners reach the server directly over the cluster network, so proxying
      # through the server is fine and avoids signed-URL/hostname complications.
      enableDirectDownloads: false
      cacheCleanupOlderThanDays: 30
      cacheFilesystemMaxUsagePercent: 85
      storage:
        driver: filesystem
        filesystem:
          path: /data/cache
      db:
        driver: sqlite
        sqlite:
          path: /data/cache-server.db

    # Chart PVC disabled — local-path would land on the 931 GB spinning disk.
    persistentVolumeClaim:
      enabled: false

    extraVolumes:
      - name: data
        hostPath:
          path: /mnt/arc-block/cache
          type: Directory
    extraVolumeMounts:
      - name: data
        mountPath: /data

    resources:
      requests:
        # Observed ~1.2 CPU under a busy 12-runner pool (2026-08-15) while this
        # only requested 250m (below the chart's own 500m default) and got no
        # CPU limit — low shares under contention plus a 1s/3-failure default
        # probe caused kubelet to kill the pod mid-request, breaking in-flight
        # `docker buildx build --cache-to type=gha` calls with connection
        # refused. Node has 72 cores, so headroom isn't the constraint — fair
        # scheduling share is.
        #
        # Recurred 2026-08-21 right after the small pool's maxRunners went
        # 30->50: a burst of ~15-20 pods scheduled within a 4-min window
        # overwhelmed even the 1000m share, and the *liveness* probe (5s
        # timeout, 5 failures = 50s grace) killed the pod mid-storm — the
        # restart, not just the slowdown, is what broke an in-flight cache
        # push (E2E job on run 32502436472). Bumped again + probes loosened
        # so transient contention degrades response time instead of causing
        # a kill-and-restart cycle, which is strictly worse.
        cpu: 2000m
        memory: 512Mi
      limits:
        memory: 4Gi

    livenessProbe:
      httpGet:
        path: /health
        port: cache
      timeoutSeconds: 10
      periodSeconds: 10
      failureThreshold: 9

    readinessProbe:
      httpGet:
        path: /health
        port: cache
      timeoutSeconds: 8
      periodSeconds: 10
      failureThreshold: 5

    service:
      type: ClusterIP
      port: 3000
